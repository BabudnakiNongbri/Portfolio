<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scientific Calculator</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <!-- Header -->
   <header class="topbar">

    <div class="brand">
        <div class="brand-icon">∑</div>

        <div>
            <h1>Scientific Calculator</h1>
            <p>Advanced mathematical calculator</p>
        </div>
    </div>

    <div class="header-actions">

        <a href="../../index.html" class="back-btn">
            ← Back to Portfolio
        </a>

        <button class="history-btn" id="historyBtn">
            <span>↺</span>
            History
        </button>

    </div>

</header>


    <!-- Main Calculator -->
    <main class="calculator-layout">

        <section class="calculator">

            <!-- Display -->
            <div class="display">

                <div class="display-top">

                    <span class="mode-label" id="modeLabel">
                        DEG
                    </span>

                    <span class="memory-label" id="memoryLabel">
                        Ans: 0
                    </span>

                </div>

                <div class="expression" id="expression">
                    0
                </div>

                <div class="result" id="result">
                    0
                </div>

            </div>


            <!-- Calculator controls -->
            <div class="controls">

                <button class="control-btn active" id="degBtn">
                    DEG
                </button>

                <button class="control-btn" id="radBtn">
                    RAD
                </button>

                <button class="control-btn" data-action="open">
                    (
                </button>

                <button class="control-btn" data-action="close">
                    )
                </button>

                <button class="control-btn danger" data-action="clear">
                    AC
                </button>

                <button class="control-btn warning" data-action="delete">
                    DEL
                </button>

            </div>


            <!-- Scientific buttons -->
            <div class="scientific-grid">

                <button class="scientific" data-function="sin">
                    sin
                </button>

                <button class="scientific" data-function="cos">
                    cos
                </button>

                <button class="scientific" data-function="tan">
                    tan
                </button>

                <button class="scientific" data-function="asin">
                    sin⁻¹
                </button>

                <button class="scientific" data-function="acos">
                    cos⁻¹
                </button>

                <button class="scientific" data-function="atan">
                    tan⁻¹
                </button>

                <button class="scientific" data-function="log">
                    log
                </button>

                <button class="scientific" data-function="ln">
                    ln
                </button>

                <button class="scientific" data-function="sqrt">
                    √
                </button>

                <button class="scientific" data-function="cbrt">
                    ∛
                </button>

                <button class="scientific" data-function="square">
                    x²
                </button>

                <button class="scientific" data-function="cube">
                    x³
                </button>

                <button class="scientific" data-function="factorial">
                    x!
                </button>

                <button class="scientific" data-function="reciprocal">
                    1/x
                </button>

                <button class="scientific" data-function="power">
                    xʸ
                </button>

                <button class="scientific" data-function="percent">
                    %
                </button>

                <button class="scientific" data-function="sinh">
                    sinh
                </button>

                <button class="scientific" data-function="cosh">
                    cosh
                </button>

                <button class="scientific" data-function="tanh">
                    tanh
                </button>

                <button class="scientific" data-value="Math.PI">
                    π
                </button>

                <button class="scientific" data-value="Math.E">
                    e
                </button>

                <button class="scientific" data-action="ans">
                    Ans
                </button>

            </div>


            <!-- Number pad -->
            <div class="number-grid">

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="/">÷</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button class="operator" data-value="+">+</button>
                <button class="equals" data-action="calculate">=</button>

            </div>

        </section>


        <!-- History Panel -->
        <aside class="history-panel" id="historyPanel">

            <div class="history-header">

                <div>
                    <h2>Calculation History</h2>
                    <p>Your recent calculations</p>
                </div>

                <button class="close-history" id="closeHistory">
                    ×
                </button>

            </div>


            <div class="history-list" id="historyList">

                <div class="empty-history">
                    <div class="empty-icon">∑</div>
                    <h3>No calculations yet</h3>
                    <p>Your calculations will appear here.</p>
                </div>

            </div>


            <button class="clear-history" id="clearHistory">
                Clear History
            </button>

        </aside>

    </main>


    <footer>
        <p>
            Scientific Calculator
            <span>•</span>
            HTML
            <span>•</span>
            CSS
            <span>•</span>
            JavaScript
        </p>

        <p class="keyboard-hint">
            Keyboard supported
        </p>
    </footer>

</div>


<script src="js/script.js"></script>

</body>
</html>
