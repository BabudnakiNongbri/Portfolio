<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration | Department Portal</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🎓 Department Portal
    </div>

    <ul class="nav-links">

        <li><a href="index.html">Home</a></li>

        <li><a href="about.html">About Us</a></li>

        <li><a href="login.html">Login</a></li>

        <li><a href="register.html">Register</a></li>

    </ul>

</nav>


<section class="form-section">

    <div class="form-box">

        <h1>Create Account</h1>

        <p>Register as a department user</p>

        <form action="register.php"
              method="POST"
              onsubmit="return validateRegister()">

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Full Name"
                required>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Email Address"
                required>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already registered?
            <a href="login.html">Login</a>
        </p>

    </div>

</section>


<script src="js/script.js"></script>

</body>

</html>
